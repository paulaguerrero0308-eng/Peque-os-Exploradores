<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pequeños Exploradores</title>
    <link rel="icon" type="image/x-icon" href="../img/Isotipo .png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/actividad-sol.css">
</head>
<body>

    <!-- Botón Menú Cápsula (Arriba Izquierda) -->
    <a href="intro-plantas.html" class="btn-menu-capsula" title="Volver al menú">
        <span class="icon-home">🏠</span>
        <span class="texto-menu">Menú</span>
    </a>

    <!-- Botón Flotante de Sonido (Tu estructura exacta) -->
    <button id="btn-audio-top" class="btn-sonido-flotante" title="Sonido">
        <img src="../img/Sonido.png" alt="Sonido activado" id="img-audio-on" class="icono-audio">
        <img src="../img/Sonido desactivado .png" alt="Sonido desactivado" id="img-audio-off" class="icono-audio oculta">
    </button>

    <!-- Botón Flecha Siguiente (Arriba Derecha) -->
    <a href="necesidades-planta.html" class="btn-flecha-siguiente" id="btn-siguiente" title="Siguiente">
        <img src="../img/siguiente.png" alt="Siguiente">
    </a>

    <!-- Header Banners PNG -->
    <header class="header-juego">
        <!-- Banners Iniciales -->
        <img src="../img/actividad 2 seres vivos/A jugar .png" alt="¡A jugar!" class="banner-titulo" id="banner-inicial">
        <img src="../img/actividadsol/Arrastra el sol .png" alt="Arrastra el sol hasta la planta" class="banner-instruccion" id="subtitulo-inicial">

        <!-- Banners Finales (Ocultos al principio) -->
        <img src="../img/actividadsol/Excelente .png" alt="¡Excelente!" class="banner-titulo oculta" id="banner-exito">
        <img src="../img/actividadsol/La planta recibió la luz.png" alt="La planta recibió la luz del sol" class="banner-instruccion oculta" id="subtitulo-exito">
    </header>

    <!-- Escena Principal -->
    <main class="escena-juego">
        
        <!-- Columna Nico + Globo PNG -->
        <div class="columna-nico">
            <div class="contenedor-globo">
                <img src="../img/actividadsol/Globo - Arrastra .png" alt="Globo Nico Inicial" class="img-globo" id="globo-inicial">
                <img src="../img/actividadsol/Muy bien .png" alt="Globo Nico Éxito" class="img-globo oculta" id="globo-exito">
            </div>
            
            <div class="personaje-oso">
                <img src="../gif/oso hablando.gif" alt="Oso Explorador" class="oso-img" id="oso-nico">
            </div>
        </div>

        <!-- Zona de Juego Drag & Drop -->
        <div class="zona-interactiva">
            
            <!-- Elemento Arrastrable: Sol -->
            <div class="sol-container" id="sol-arrastrable" draggable="true">
                <img src="../img/actividadsol/Sol resplandeciente .png" alt="Sol" class="img-sol">
            </div>

            <!-- Zona de Soltado: Maceta/Planta -->
            <div class="maceta-dropzone" id="zona-maceta">
                <img src="../img/actividadsol/Planta - Sol .png" alt="Planta marchita" class="img-planta" id="planta-inicial">
                <img src="../img/actividadsol/Planta con destello .png" alt="Planta destello" class="img-planta oculta" id="planta-destello">
            </div>

        </div>

    </main>

    <!-- Audios del juego -->
    <audio id="audio-inicial" src="../audios/plantas/ayudasol.mp3" autoplay></audio>
    <audio id="audio-exito" src="../audios/plantas/muybiensol.mp3"></audio>

    <script src="../js/actividad-sol.js" defer></script>
</body>
</html>
