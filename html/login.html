<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <title>Pequeños Exploradores</title>
    <!-- Ícono de la pestaña -->
    <link rel="icon" type="image/png" href="../img/Isotipo.png">

    <!-- Sale de html/ y entra a css/ -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <header class="header">
        <!-- Sale de html/ y entra a img/ -->
        <img src="../img/Titulo-Pequeños exploradores.png" alt="Logo Pequeños Exploradores" class="logo">
    </header>

    <main class="login">

        <!-- Sale de html/ y entra a gif/ -->
        <img src="../gif/OSO-ANIMADO.gif" alt="Oso Explorador" id="oso">

        <section class="login__content">

            <h1 class="login__title">¡Bienvenido!</h1>

            <form class="form-register">

                <div class="form__field">
                    <label class="form__label" for="name">Nombre</label>
                    <input class="form__input" type="text" id="name" placeholder="Ingresa tu Nombre Explorador">
                </div>

                <div class="form__field">
                    <label class="form__label" for="password">Contraseña</label>
                    <input class="form__input" type="password" id="password" placeholder="Ingresa tu contraseña Explorador">
                </div>

                <button class="form__button" type="submit">
                    Iniciar Sesión
                </button>

            </form>

            <nav class="login__links">
                <a href="register.html">¿Aún no tienes una cuenta? Crear una</a>
            
                <a href="menu.html" class="link-volver">← Volver al Menú Principal</a>
            </nav>

        </section>

    </main>

    <!-- Sale de html/ y busca en js/ -->
    <script src="../js/login.js" defer></script>
</body>
</html>
